    <path d="M80 60c0-18-14-30-30-30-12 0-22 7-27 17-3-1-5-2-8-2-11 0-20 9-20 20s9 20 20 20h63c11 0 20-9 20-20 0-10-7-18-16-20 0-2-1-4-2-5z"
          fill="#38bdf8"/>
    <!-- Lightning -->
    <polygon points="70,50 45,95 75,95 60,140 110,80 80,80 95,50"
             fill="#facc15"/>
  </g>

  <!-- Title (right side) -->
  <text x="360" y="130" text-anchor="middle"
        font-family="Segoe UI, Arial, sans-serif"
        font-size="26"
        font-weight="600"
        fill="#e2e8f0">
